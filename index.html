<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a9ff0">
  <meta name="description" content="CarOne — koreys avtomobillari uchun ehtiyot qismlar do'koni">
  <title>CarOne — avto ehtiyot qismlar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Yuqori panel: logo + qidiruv -->
  <header class="topbar" id="topbar">
    <div class="topbar__row">
      <a href="#/" class="logo" aria-label="CarOne bosh sahifa">
        <span class="logo__mark">C1</span><span class="logo__text">Car<b>One</b></span>
      </a>
      <a href="tel:+998000000000" class="topbar__call" aria-label="Qo'ng'iroq qilish">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      </a>
    </div>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg class="search__icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" inputmode="search" enterkeyhint="search"
             placeholder="Nomi, artikul yoki mashina: Nexia filtr…" aria-label="Mahsulot qidirish">
      <button type="button" class="search__clear" id="searchClear" aria-label="Tozalash" hidden>×</button>
      <a href="#/scan" class="search__cam" aria-label="Rasm orqali qidirish">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
      </a>
      <div class="suggest" id="suggest" hidden></div>
    </form>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <!-- Pastki menyu -->
  <nav class="tabbar" aria-label="Asosiy menyu">
    <a href="#/" data-tab="home" class="tab">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Bosh sahifa</span>
    </a>
    <a href="#/catalog" data-tab="catalog" class="tab">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Katalog</span>
    </a>
    <a href="#/scan" data-tab="scan" class="tab tab--scan">
      <span class="tab__scan-btn">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
      </span>
      <span>Rasm orqali</span>
    </a>
    <a href="#/cart" data-tab="cart" class="tab">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L20.5 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span>Savat</span>
      <i class="badge" id="cartBadge" hidden>0</i>
    </a>
    <a href="#/account" data-tab="account" class="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Kabinet</span>
    </a>
  </nav>

  <!-- Mahsulot oynasi (bottom sheet) -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button class="sheet__close" data-close aria-label="Yopish">×</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/scan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
